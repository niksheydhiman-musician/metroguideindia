<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Route Planner | MetroGuideIndia</title>
  <meta name="description" content="Metro and RRTS route planner for Delhi–Meerut Namo Bharat RRTS and Meerut Metro." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ── Navigation ── -->
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <div class="logo-mark">🚄</div>
        MetroGuideIndia
      </a>
      <span class="nav-badge">Beta</span>
    </div>
  </nav>

  <main>
    <div class="container">

      <!-- ── Route Page Header ── -->
      <div class="route-page-header">
        <a href="index.html" class="back-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
          Back to Home
        </a>
        <h1 class="route-page-title" id="route-page-title">Route Planner</h1>
        <p class="route-page-subtitle" id="route-page-subtitle">Loading route information…</p>
      </div>

      <!-- ── Route Result ── -->
      <section id="route-result" aria-live="polite"></section>

      <!-- ── Search Again ── -->
      <section style="margin: 32px 0 48px;">
        <div class="search-card">
          <div class="section-eyebrow" style="margin-bottom:16px;font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);">
            Search Another Route
          </div>
          <div class="search-field">
            <label for="source-select" class="search-label">From</label>
            <select id="source-select" class="station-select"></select>
          </div>
          <button class="swap-btn" id="swap-btn" title="Swap stations">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M7 16l-4-4m0 0l4-4m-4 4h18M17 8l4 4m0 0l-4 4"/>
            </svg>
          </button>
          <div class="search-field">
            <label for="dest-select" class="search-label">To</label>
            <select id="dest-select" class="station-select"></select>
          </div>
          <button class="find-btn" id="find-btn" onclick="handleFindRoute()">Find Route</button>
        </div>
      </section>

    </div>
  </main>

  <!-- ── Footer ── -->
  <footer>
    <div class="container">
      <div class="footer-logo">🚄 MetroGuideIndia</div>
      <p class="footer-desc">Delhi–Meerut Namo Bharat RRTS and Meerut Metro route planner.</p>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <span>·</span>
        <span>Data by NCRTC</span>
      </div>
      <div class="footer-copy">© 2025 MetroGuideIndia. For informational purposes only.</div>
    </div>
  </footer>

  <button class="scroll-top" id="scroll-top" aria-label="Scroll to top">↑</button>

  <script src="js/dataLoader.js"></script>
  <script src="js/graphBuilder.js"></script>
  <script src="js/routeFinder.js"></script>
  <script src="js/routeUI.js"></script>
  <script src="js/seoGenerator.js"></script>
  <script>
    let appData = null;
    let graph   = null;

    (async () => {
      try {
        appData = await DataLoader.loadAll();
        graph   = GraphBuilder.build(appData.connections);
        populateDropdowns();
        loadRouteFromURL();
      } catch (e) {
        RouteUI.renderError('route-result', 'Failed to load transit data. Please try again.');
      }
    })();

    function populateDropdowns() {
      const { stations } = appData;
      const seen = new Set();
      const unique = stations.filter(s => {
        const key = `${s.station_name}__${s.system_id}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      unique.sort((a, b) => {
        if (a.system_id !== b.system_id) return a.system_id === 'rrts' ? -1 : 1;
        return parseInt(a.order) - parseInt(b.order);
      });
      const systemLabels = { rrts: 'Namo Bharat RRTS', meerut_metro: 'Meerut Metro' };
      const groups = {};
      unique.forEach(s => {
        if (!groups[s.system_id]) groups[s.system_id] = [];
        groups[s.system_id].push(s);
      });
      ['source-select', 'dest-select'].forEach(id => {
        const sel = document.getElementById(id);
        sel.innerHTML = '<option value="">Select station</option>';
        Object.entries(groups).forEach(([sysId, stns]) => {
          const og = document.createElement('optgroup');
          og.label = systemLabels[sysId] || sysId;
          stns.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.station_id;
            opt.textContent = s.station_name;
            og.appendChild(opt);
          });
          sel.appendChild(og);
        });
      });
    }

    function loadRouteFromURL() {
      const params = new URLSearchParams(window.location.search);
      const from   = params.get('from');
      const to     = params.get('to');
      if (from && to) {
        document.getElementById('source-select').value = from;
        document.getElementById('dest-select').value   = to;
        findAndRenderRoute(from, to);
      } else {
        document.getElementById('route-page-title').textContent = 'Route Planner';
        document.getElementById('route-page-subtitle').textContent = 'Select stations below to find a route.';
      }
    }

    function handleFindRoute() {
      const src  = document.getElementById('source-select').value;
      const dest = document.getElementById('dest-select').value;
      const btn  = document.getElementById('find-btn');
      if (!src || !dest) { alert('Please select both stations.'); return; }
      btn.classList.add('loading');
      btn.textContent = '';
      setTimeout(() => {
        btn.classList.remove('loading');
        btn.textContent = 'Find Route';
        findAndRenderRoute(src, dest);
        const slug = SEOGenerator.routeSlug(
          appData.stations.find(s=>s.station_id===src)?.station_name || src,
          appData.stations.find(s=>s.station_id===dest)?.station_name || dest
        );
        history.pushState({}, '', `?route=${slug}&from=${src}&to=${dest}`);
      }, 400);
    }

    function findAndRenderRoute(src, dest) {
      const path = RouteFinder.findRoute(graph, src, dest);
      const srcStation  = appData.stations.find(s => s.station_id === src);
      const destStation = appData.stations.find(s => s.station_id === dest);

      if (srcStation && destStation) {
        document.getElementById('route-page-title').textContent =
          `${srcStation.station_name} → ${destStation.station_name}`;
        document.getElementById('route-page-subtitle').textContent =
          `${srcStation.system_id === 'rrts' ? 'Namo Bharat RRTS' : 'Meerut Metro'} Route`;
      }

      if (!path || path.length === 0) {
        RouteUI.renderError('route-result', 'No route found between these stations.');
        return;
      }

      const distance = RouteFinder.calcDistance(path, graph);
      const fare     = RouteFinder.calcFare(distance);
      const time     = RouteFinder.calcTime(distance);

      RouteUI.renderRoute('route-result', path, appData.stations, appData.interchanges, distance, fare, time);

      if (srcStation && destStation) {
        const seoContent = SEOGenerator.generateRouteContent(
          srcStation.station_name, destStation.station_name,
          path, appData.stations, distance, fare, time
        );
        const card = document.querySelector('.route-result-card');
        if (card) {
          const seoDiv = document.createElement('div');
          seoDiv.className = 'seo-content';
          seoDiv.innerHTML = seoContent;
          card.appendChild(seoDiv);
        }
        SEOGenerator.setMetaTags({
          title: SEOGenerator.generateRouteTitle(srcStation.station_name, destStation.station_name),
          description: SEOGenerator.generateRouteDescription(srcStation.station_name, destStation.station_name, distance, fare, time),
        });
      }
    }

    document.getElementById('swap-btn').addEventListener('click', () => {
      const src  = document.getElementById('source-select');
      const dest = document.getElementById('dest-select');
      [src.value, dest.value] = [dest.value, src.value];
    });

    const scrollTopBtn = document.getElementById('scroll-top');
    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('show', window.scrollY > 400);
    });
    scrollTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  </script>
</body>
</html>
